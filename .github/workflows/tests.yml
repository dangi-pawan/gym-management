name: Tests

on:
  push:
    branches:
      - feature/complete-auth-rbac
      - feature/dev-email-invitations
      - feature/membership-management
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        env:
          ENV_FILE: .env.test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gym_management_test
          JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
        run: alembic upgrade head

      - name: Run tests
        env:
          ENV_FILE: .env.test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gym_management_test
          JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
        run: pytest -q
